<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The English-Minute Jar</title><style>*{box-sizing:border-box}body{margin:0;background:#faf3df;color:#332d26;font:clamp(17px,2vw,23px)/1.5 Georgia,serif}main{max-width:850px;margin:auto;padding:1em}h1{font-size:1.55em;margin:0 0 .4em}#stage{position:relative;aspect-ratio:2.5;background-size:cover;background-position:center;border-radius:16px;overflow:hidden}img{position:absolute;bottom:0;height:92%;animation:breathe 3s ease-in-out infinite alternate;transform-origin:bottom}@keyframes breathe{to{transform:rotate(.8deg) scaleY(.985)}}@media(prefers-reduced-motion:reduce){img{animation:none}}button{font:inherit;color:white;background:#375e50;padding:.35em .9em;border:0;border-radius:.45em;cursor:pointer;margin:.25em}p{margin:.4em 0 .7em}#speaker{display:block;color:#754626;margin-top:.65em}</style><main><h1>The English-Minute Jar</h1><div id="stage"></div><div aria-live="polite"><strong id="speaker"></strong><p id="words"></p></div><div id="actions"></div></main><script>const pack={"format":2,"title":"The English-Minute Jar","profile":"english-corner","description":"About ten minutes, including a partner prediction and a closing discussion.","notice":"An original English Corner story.","script":"story 2\nlabel monday\nscene kitchen\nshow Pip proud left\nshow Poppy curious right\nI: On Monday morning Pip the red panda put his ear to an empty jar. He knocked on the glass. It had a nice, deep sound. It sounded like a jar that could win something.\nPip [proud]: Mine. I called it.\nPoppy [curious]: What are we collecting?\nshow Mum happy center\nMum [happy]: English minutes. Every ten minutes you spend doing something in English earns a bean. On Friday we'll count. You can sing, read, play a game…\nPip [determined]: What's the HARDEST thing we've got?\nI: Mum handed him an English workbook. Poppy picked a comic called The Rabbit Hotel. On the cover a rabbit was pushing a very large towel under a very small door.\nPoppy [curious]: Why is the floor wet?\nMum [happy]: Shall we see?\nscene kitchen\nshow Pip proud left\nshow Dad curious right\nPip [proud]: Start the clock, Dad. I'm going to fill my jar through pure willpower.\nDad [curious]: How much willpower have you got?\nPip [determined]: Enough for two jars. How long has it been?\nDad [neutral]: Seven seconds.\nI: Pip copied a sentence about a man who owned a brown suitcase. His tail tapped the chair leg. The man also owned a brown hat. Pip began to wish something would happen to the man.\nchoice suitcase\noption invent \"Invent something inside the suitcase.\" -> cabbage\noption copy \"Stick to Pip's original plan.\" -> shoes\nlabel cabbage\nPip [curious]: What if he opens the suitcase and finds a head? A cabbage head, Dad. It's a vegetable mystery.\nDad [happy]: I'd read that. Want to write the next sentence?\nPip [determined]: After my serious English. First I have to finish copying this one.\ngoto timer\nlabel shoes\nI: He copied the sentence again, first in very small letters, then in very large letters. The suitcase changed size. The man's day stayed exactly the same.\nDad [curious]: Any plans for that poor man?\nPip [determined]: If he buys brown shoes, I'm closing the book.\ngoto timer\nlabel timer\nI: DING! Pip dropped his first bean into the jar. Across the table Poppy didn't look up. Dad sat beside her to see why the rabbit needed all those towels.\nscene kitchen\nshow Poppy curious left\nshow Dad happy right\nPoppy [curious]: The guest says, “Could I have another one?” Another what?\nDad [happy]: Look at the picture. What's he holding out of the door?\nPoppy [happy]: A wet towel! Look at his little blue hand.\nDad [skeptical]: Is that a hand?\nI: Poppy turned the page. Something enormous and blue was sitting in the upstairs bathtub. It was a whale. The rabbit brought another towel. He charged extra for the seaweed.\nscene kitchen\nshow Pip worried left\nshow Poppy happy right\nI: By Wednesday Pip had four beans. He had also discovered that a bean would balance on the end of a pencil if he held his breath and kept his left ear perfectly still.\nPoppy [curious]: Are you doing English?\nPip [embarrassed]: I'm taking a short break from a short break.\nI: The bean fell into his milk. Pip fished it out. His timer sat beside his workbook. Just looking at it made him tired.\nPip [worried]: Maybe I'm the kind of person who can't learn English.\nPoppy [curious]: You wrote “WANTED: ONE MISSING BEAN” on your milk carton.\nPip [neutral]: That was different. I needed witnesses.\nI: Meanwhile Poppy had a problem of her own. The comic said the whale had come upstairs by “lift.” She knew you could lift a box. Dad was strong, but nobody was THAT strong.\nchoice lift\noption picture \"Look for a clue in the picture.\" -> clue\noption listen \"Ask someone to read the line aloud.\" -> aloud\nlabel clue\nPoppy [curious]: Two silver doors, a button, a number over the door. Oh! Our apartment has one of those.\nI: She read the line again. This time she could picture the whale pressing the button with one careful fin.\ngoto photo\nlabel aloud\nI: Pip tried the rabbit's line. “Take the lift to the second floor.” Poppy put her finger on the two silver doors.\nPoppy [happy]: Like an elevator! I thought the rabbit picked up the whale. I was about to ask where he goes to the gym.\ngoto photo\nlabel photo\nPoppy [skeptical]: Hang on. The whale is wider than the lift!\nI: On Thursday Mum read with her. They looked back at page one. On the hotel wall was an old photograph. Same rabbit. Much shorter ears. Poppy put her finger on a blue spot in the corner.\nPoppy [curious]: Do you think that's a baby whale?\nI: Mum had a theory. Dad had a different theory involving butter. Poppy tucked a leaf between the pages. On Friday she would find out.\nI: Before Friday arrives, tell a partner your theory. How did a whale wider than the lift end up on the second floor? Use one clue from the comic.\nscene kitchen\nshow Mum neutral center\nshow Pip embarrassed left\nshow Poppy happy right\nMum [neutral]: Time to count!\nI: Pip tipped his jar. Four beans rolled out. Poppy turned hers upside down. A bit of dust fell out. Pip stared. He'd seen his sister reading every evening.\nPip [curious]: Where are all your beans?\nPoppy [embarrassed]: Oh. I forgot about the jars.\nI: They worked it out together. Twenty minutes on Monday. Thirty on Tuesday with Dad. Thirty on Wednesday. Thirty on Thursday with Mum. Poppy counted eleven beans into her jar.\nPip [worried]: An hour and fifty minutes? I had to make myself do forty. I wanted to get good at English more than anything. What did you want?\nPoppy [happy]: To find out how a whale got upstairs.\nI: She slid the comic across the table. Pip looked at the whale. He looked at the door. Suddenly he had an opinion about Dad's butter theory.\nPip [curious]: May I read the last page to you?\nPoppy [happy]: Please. I've been waiting all day.\nI: “I took the lift,” said the whale. “I was very small.” In the old photograph the rabbit carried a bucket in one paw. A tiny blue tail stuck over the side.\nPip [curious]: Why didn't he leave while he still fit through the door?\nI: The whale opened a thick brown book. It was the hotel menu. “On my first morning,” he explained, “I ordered breakfast in bed. Have you tried the pancakes here?”\nPoppy [happy]: He liked breakfast so much he stayed and GREW UP!\nI: Pip turned back three pages. There was a stack of dirty plates outside Room Six. The artist had given him the clue and he'd walked right past it.\nPip [determined]: Wait. I want to read it again from the beginning. You do the rabbit. I'll do the whale.\nI: His tail stopped tapping. They tried three different whale voices. The best one sounded like Dad ordering noodles when he had a cold.\nscene kitchen\nshow Mum happy center\nshow Pip happy left\nshow Dad curious right\nMum [happy]: That's ten minutes, Pip. Would you like a bean?\nPip [happy]: Put it in for me? I get it now. When I like what I'm doing in English, I keep going after the timer rings. Tomorrow I'm writing that cabbage mystery.\nDad [curious]: Could you two keep reading out loud? Your mother and I have a question.\nI: Dad pulled a chair up to the table. Mum already had a pencil ready. From behind his back Dad produced a frying pan.\nDad [happy]: Does that hotel give out its pancake recipe?\nI: The story suggests that people who enjoy something will always work harder at it than people who rely on willpower alone. Do you agree or disagree? Why? Give an example from the story or your own life.\nend","assets":{"characters":{"Pip":{"name":"Pip","expressions":{"neutral":{"name":"neutral","src":"data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20205%20260%22%3E%3Cpath%20d%3D%22M126%20179Q213%20118%20191%20195Q178%20230%20128%20223%22%20fill%3D%22%23be643f%22%20stroke%3D%22%236a3831%22%20stroke-width%3D%225%22%2F%3E%3Cpath%20d%3D%22m166%20160%2019%2022m-28-7%2020%2024%22%20stroke%3D%22%236a3831%22%20stroke-width%3D%2210%22%2F%3E%3Cpath%20d%3D%22M62%20217v28m53-28v28%22%20stroke%3D%22%23543934%22%20stroke-width%3D%2222%22%20stroke-linecap%3D%22round%22%2F%3E%3Crect%20x%3D%2242%22%20y%3D%22134%22%20width%3D%2299%22%20height%3D%2296%22%20rx%3D%2230%22%20fill%3D%22%23447e90%22%2F%3E%3Cpath%20d%3D%22m47%2069-7-52q24%200%2048%2030m28-2q18-24%2043-28l-4%2062%22%20fill%3D%22%23543934%22%20stroke%3D%22%23fff0ce%22%20stroke-width%3D%226%22%2F%3E%3Cellipse%20cx%3D%2298%22%20cy%3D%2296%22%20rx%3D%2278%22%20ry%3D%2261%22%20fill%3D%22%23c56843%22%2F%3E%3Cpath%20d%3D%22m27%2096%2044-3-28%2041zm139%200-44-3%2027%2041z%22%20fill%3D%22%23fff0ce%22%2F%3E%3Cpath%20d%3D%22m49%2078%2019-4m58%200%2017%204%22%20stroke%3D%22%23fff0ce%22%20stroke-width%3D%228%22%20stroke-linecap%3D%22round%22%2F%3E%3Cg%20fill%3D%22%23342e2e%22%3E%3Ccircle%20cx%3D%2265%22%20cy%
